
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA Admin Panel</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0915;color:#fff;font-family:Arial,sans-serif}
header{padding:18px;background:#171326;border-bottom:1px solid #38265c}
header h2{margin:0;color:#c39aff}
main{max-width:850px;margin:auto;padding:16px}
.card{background:#171326;border:1px solid #38265c;border-radius:14px;padding:18px;margin-bottom:16px}
h3{color:#c39aff;margin-top:0}
input,select,textarea,button{
width:100%;padding:12px;margin:7px 0;border-radius:8px;
border:1px solid #49366c;background:#100d1c;color:white
}
textarea{min-height:75px;resize:vertical}
button{background:#762bea;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.danger{background:#a52b45}
.secondary{background:#40345b}
.product{display:flex;gap:12px;align-items:center;border-bottom:1px solid #38265c;padding:12px 0}
.product img{width:65px;height:65px;object-fit:cover;border-radius:9px;background:#292039}
.product-info{flex:1;min-width:0}
.product-info p{margin:5px 0;color:#bcb2cc;font-size:13px;overflow-wrap:anywhere}
.product button{width:auto;padding:9px 12px}
#app{display:none}
#status,#loginStatus{color:#d6baff;font-size:14px;overflow-wrap:anywhere}
.small{color:#aaa;font-size:12px}
label{display:block;margin-top:10px;color:#d6baff}
</style>
</head>

<body>
<header><h2>NEXORA ADMIN</h2></header>

<main>

<section class="card" id="login">
<h3>Admin Login</h3>
<form id="loginForm">
<input id="email" type="email" placeholder="Admin email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">LOGIN</button>
</form>
<p id="loginStatus"></p>
</section>

<div id="app">

<section class="card">
<h3>Dashboard</h3>
<p id="welcome"></p>
<p id="totalProducts">Products: Loading...</p>
<button class="secondary" id="logoutButton">LOGOUT</button>
</section>

<section class="card">
<h3>Add New Product</h3>

<form id="productForm">

<label>Product Name</label>
<input id="name" maxlength="120" placeholder="Enter product name" required>

<label>Category</label>
<select id="category" required>
<option value="">Loading categories...</option>
</select>

<label>Description</label>
<textarea id="description" placeholder="Product details"></textarea>

<label>Version</label>
<input id="version" maxlength="40" placeholder="e.g. 4.7">

<label>Price - 1 Day (INR)</label>
<input id="price1" type="number" min="0" step="0.01" value="0" required>

<label>Price - 7 Days (INR)</label>
<input id="price7" type="number" min="0" step="0.01" value="0" required>

<label>Price - 30 Days (INR)</label>
<input id="price30" type="number" min="0" step="0.01" value="0" required>

<label>Upload APK (Maximum 50 MB)</label>
<input id="apk" type="file" accept=".apk,application/vnd.android.package-archive" required>

<p class="small">
APK ka original icon automatic extract hoga. Alag image upload karne ki zaroorat nahi.
</p>

<label>Display Order</label>
<input id="sort" type="number" value="0">

<button id="saveButton" type="submit">UPLOAD APK & ADD PRODUCT</button>

<p id="status"></p>

</form>
</section>

<section class="card">
<h3>Manage Products</h3>
<div id="productList">Loading products...</div>
</section>

</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/app-info-parser@1.1.6/dist/app-info-parser.min.js"></script>

<script>
const loginBox=document.getElementById("login");
const app=document.getElementById("app");
const loginStatus=document.getElementById("loginStatus");
const statusBox=document.getElementById("status");

function safe(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function makeId(){
 return Date.now()+"-"+Math.random().toString(36).slice(2);
}

async function checkAdmin(){
 try{
  const {data:{user},error:userError}=await db.auth.getUser();

  if(userError) throw userError;
  if(!user) return;

  const {data,error}=await db.from("profiles")
   .select("role").eq("id",user.id).single();

  if(error || data?.role!=="admin"){
   await db.auth.signOut();
   loginStatus.textContent="Admin access denied.";
   return;
  }

  loginBox.style.display="none";
  app.style.display="block";
  document.getElementById("welcome").textContent="Logged in: "+user.email;

  await loadCategories();
  await loadProducts();

 }catch(error){
  loginStatus.textContent="Error: "+error.message;
 }
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 loginStatus.textContent="Checking login...";

 const {error}=await db.auth.signInWithPassword({
  email:document.getElementById("email").value.trim(),
  password:document.getElementById("password").value
 });

 if(error){
  loginStatus.textContent=error.message;
  return;
 }

 await checkAdmin();
});

document.getElementById("logoutButton").addEventListener("click",async()=>{
 await db.auth.signOut();
 location.reload();
});

async function loadCategories(){
 const {data,error}=await db.from("categories")
  .select("id,name").order("sort_order");

 if(error) throw error;

 const select=document.getElementById("category");
 select.innerHTML='<option value="">Select category</option>';

 data.forEach(c=>{
  const option=document.createElement("option");
  option.value=c.id;
  option.textContent=c.name;
  select.appendChild(option);
 });
}

async function loadProducts(){
 const list=document.getElementById("productList");
 list.textContent="Loading products...";

 const {data,error}=await db.from("products")
  .select("id,name,price,price_1_day,price_7_days,price_30_days,version,image_url,app_file_path,categories(name)")
  .order("created_at",{ascending:false});

 if(error){
  list.textContent=error.message;
  return;
 }

 document.getElementById("totalProducts").textContent=
  "Total products: "+data.length;

 if(!data.length){
  list.textContent="No products added yet.";
  return;
 }

 list.innerHTML=data.map(p=>`
  <div class="product">
   <img src="${safe(p.icon_url || p.image_url || '')}" alt="">
   <div class="product-info">
    <strong>${safe(p.name)}</strong>
    <p>${safe(p.categories?.name || "No category")}</p>
    <p>1 Day: ₹${safe(p.price_1_day)} | 7 Days: ₹${safe(p.price_7_days)} | 30 Days: ₹${safe(p.price_30_days)}</p>
    <p>${safe(p.version || "")}</p>
   </div>
   <button class="danger" data-delete="${safe(p.id)}">Delete</button>
  </div>
 `).join("");

 list.querySelectorAll("[data-delete]").forEach(button=>{
  button.addEventListener("click",()=>{
   deleteProduct(button.dataset.delete);
  });
 });
}

function iconToBlob(icon){
 if(!icon) throw new Error("APK ke andar app icon nahi mila.");

 if(icon instanceof Blob) return icon;

 if(typeof icon!=="string")
  throw new Error("APK icon format samajh nahi aaya.");

 let mime="image/png";
 let base64=icon;

 const match=icon.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,(.*)$/s);

 if(match){
  mime=match[1];
  base64=match[2];
 }

 const binary=atob(base64);
 const bytes=new Uint8Array(binary.length);

 for(let i=0;i<binary.length;i++){
  bytes[i]=binary.charCodeAt(i);
 }

 return new Blob([bytes],{type:mime});
}

document.getElementById("productForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const button=document.getElementById("saveButton");
 button.disabled=true;

 let apkPath=null;
 let iconPath=null;

 try{
  statusBox.textContent="Checking product details...";

  const name=document.getElementById("name").value.trim();
  const categoryId=document.getElementById("category").value;
  const version=document.getElementById("version").value.trim();
  const description=document.getElementById("description").value.trim();

  const price1=Number(document.getElementById("price1").value);
  const price7=Number(document.getElementById("price7").value);
  const price30=Number(document.getElementById("price30").value);

  const sortOrder=Number(document.getElementById("sort").value)||0;
  const file=document.getElementById("apk").files[0];

  if(!name || !categoryId)
   throw new Error("Product name aur category select karo.");

  if(![price1,price7,price30].every(v=>Number.isFinite(v)&&v>=0))
   throw new Error("Teeno prices sahi enter karo.");

  if(!file) throw new Error("APK file select karo.");

  if(!file.name.toLowerCase().endsWith(".apk"))
   throw new Error("Sirf APK file upload karo.");

  if(file.size>50*1024*1024)
   throw new Error("APK maximum 50 MB ki honi chahiye.");

  if(!window.AppInfoParser)
   throw new Error("APK parser load nahi hua. Page refresh karke dobara try karo.");

  statusBox.textContent="APK ka original icon extract ho raha hai...";

  const parser=new window.AppInfoParser(file);
  const result=await parser.parse();

  const iconBlob=iconToBlob(result.icon);

  statusBox.textContent="APK private storage mein upload ho raha hai...";

  const unique=makeId();
  const apkName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");

  apkPath="products/"+unique+"-"+apkName;

  const {error:apkError}=await db.storage
   .from("app-downloads")
   .upload(apkPath,file,{
    contentType:"application/vnd.android.package-archive",
    upsert:false
   });

  if(apkError) throw apkError;

  statusBox.textContent="App icon public storage mein upload ho raha hai...";

  const iconExt=iconBlob.type==="image/jpeg"?"jpg":
   iconBlob.type==="image/webp"?"webp":"png";

  iconPath="product-icons/"+unique+"."+iconExt;

  const {error:iconError}=await db.storage
   .from("site-media")
   .upload(iconPath,iconBlob,{
    contentType:iconBlob.type,
    upsert:false
   });

  if(iconError) throw iconError;

  const {data:urlData}=db.storage
   .from("site-media").getPublicUrl(iconPath);

  const iconUrl=urlData.publicUrl;

  statusBox.textContent="Product database mein save ho raha hai...";

  const product={
   name:name,
   category_id:categoryId,
   description:description,
   version:version,
   price:price30,
   price_1_day:price1,
   price_7_days:price7,
   price_30_days:price30,
   image_url:iconUrl,
   icon_url:iconUrl,
   app_file_path:apkPath,
   file_type:"apk",
   download_url:null,
   sort_order:sortOrder,
   is_active:true
  };

  const {error:insertError}=await db.from("products").insert(product);

  if(insertError) throw insertError;

  statusBox.textContent="Product successfully added! APK aur icon upload ho gaye.";

  document.getElementById("productForm").reset();
  document.getElementById("price1").value="0";
  document.getElementById("price7").value="0";
  document.getElementById("price30").value="0";
  document.getElementById("sort").value="0";

  await loadProducts();

 }catch(error){

  statusBox.textContent="Error: "+(error.message||"Unknown error");

  // Failed database insertion par uploaded files ko clean karne ki koshish.
  // Upload error ke case mein bhi safe cleanup.
  if(apkPath){
   await db.storage.from("app-downloads").remove([apkPath]);
  }

  if(iconPath){
   await db.storage.from("site-media").remove([iconPath]);
  }

 }finally{
  button.disabled=false;
 }
});

async function deleteProduct(id){
 if(!confirm("Delete this product?")) return;

 const {data,error}=await db.from("products")
  .select("app_file_path,icon_url,image_url")
  .eq("id",id).single();

 if(error){
  alert(error.message);
  return;
 }

 const {error:deleteError}=await db.from("products")
  .delete().eq("id",id);

 if(deleteError){
  alert(deleteError.message);
  return;
 }

 if(data.app_file_path){
  await db.storage.from("app-downloads").remove([data.app_file_path]);
 }

 const imageUrl=data.icon_url||data.image_url;

 if(imageUrl){
  const marker="/storage/v1/object/public/site-media/";
  const index=imageUrl.indexOf(marker);

  if(index!==-1){
   const imagePath=decodeURIComponent(imageUrl.slice(index+marker.length));
   await db.storage.from("site-media").remove([imagePath]);
  }
 }

 await loadProducts();
}

checkAdmin();
</script>
</body>
</html>
